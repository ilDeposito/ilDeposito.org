# /etc/nginx/nginx.conf — montato in sola lettura su frontend-web
# (vedi frontend/compose.{stage,prod}.yml).
#
# Prima era quello dell'immagine upstream macbre/nginx-brotli (nginx 1.21.0).
# Ora l'immagine è locale (frontend/nginx-image/Dockerfile: Alpine + pacchetto
# nginx + nginx-mod-http-brotli) e il suo nginx.conf di default include
# /etc/nginx/http.d/*.conf invece di conf.d. Qui manteniamo il layout "conf.d"
# perché è quello su cui si appoggiano già compose (bind mount dei singoli file)
# e ./ildeposito.sh (envsubst di realip.conf, validate_nginx_config, hash dei
# file di config): cambiarlo vorrebbe dire toccare tre punti diversi per lo
# stesso motivo. Il file è locale, non preso dal pacchetto: ogni differenza
# rispetto al default Alpine dev'essere esplicita qui dentro.

# ngx_brotli arriva dal pacchetto nginx-mod-http-brotli, che installa
# /etc/nginx/modules/10_http_brotli.conf con i `load_module`. `load_module` è
# ammesso SOLO nel contesto main (non in http/conf.d): senza questo include i
# `brotli`/`brotli_static` di nginx.conf farebbero fallire l'avvio con
# "unknown directive".
include /etc/nginx/modules/*.conf;

# L'utente esiste già nel pacchetto (pkgusers=nginx). Il master resta root e
# apre i log prima di scendere di privilegi: serve al volume condiviso con php
# (404.log, vedi nginx.conf → @log404 e Report404Command).
user nginx;
worker_processes auto;

# Il default del pacchetto è /run/nginx/nginx.pid, in una directory creata solo
# dall'init script OpenRC (che in container non gira). /run esiste già: `nginx
# -s reload` legge il pid da qui.
pid /run/nginx.pid;

error_log /var/log/nginx/error.log warn;

# Il build Alpine di nginx non abilita la JIT di PCRE (manca
# --with-pcre-jit): `pcre_jit on;` produrrebbe solo un warning a ogni avvio e
# reload ("nginx was built without PCRE JIT support"). Nessuna direttiva qui:
# se un giorno il pacchetto la abilita, si aggiunge.

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # `combined` è un formato predefinito di nginx. Il log 404 dedicato è
    # dichiarato in conf.d/00-log-formats.conf e usato solo da @log404.
    access_log /var/log/nginx/access.log combined;

    # log_format e limit_req_zone stanno nei file montati in conf.d. L'ordine
    # lessicale è un requisito di nginx (log_format deve precedere l'uso), per
    # questo il file dei formati è montato come 00-log-formats.conf.
    include /etc/nginx/conf.d/*.conf;
}
