name: Notify Backend Update Merge

on:
  pull_request:
    types: [closed]

jobs:
  notify:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'backend-upgrade/')
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /home/ubuntu/sergej/websites/ildeposito/stage

    steps:
      - name: Notify Telegram
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy-stage.yml
        run: |
          ./ildeposito.sh telegram "Aggiornamento backend mergiato su main. PR: ${PR_URL} — commit: ${MERGE_SHA}. Deploy stage: ${DEPLOY_URL}"
