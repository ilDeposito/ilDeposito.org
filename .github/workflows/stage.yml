name: Stage

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operazione da eseguire su stage
        required: true
        default: deploy
        type: choice
        options: [deploy, content, full, pdf]
      source:
        description: Origine del trigger
        required: false
        default: GitHub
        type: string

concurrency:
  group: stage-operations
  cancel-in-progress: false

jobs:
  stage:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /home/ubuntu/sergej/websites/ildeposito/stage
    steps:
      - name: Prepara deploy e dipendenze
        if: inputs.operation == 'deploy'
        env:
          DEPLOY_REF: ${{ github.sha }}
        run: ./ildeposito.sh pipeline deploy-prepare --ref "$DEPLOY_REF"
      - name: Aggiorna Drupal e indice di ricerca
        if: inputs.operation == 'deploy'
        run: ./ildeposito.sh pipeline deploy-update
      - name: Genera sito e PDF
        if: inputs.operation == 'deploy'
        env:
          BUILD_SOURCE: ${{ inputs.source }}
        run: ./ildeposito.sh pipeline deploy-build --source "$BUILD_SOURCE"
      - name: Esegue operazione di pubblicazione
        if: inputs.operation != 'deploy'
        env:
          OPERATION: ${{ inputs.operation }}
          BUILD_SOURCE: ${{ inputs.source }}
        run: ./ildeposito.sh pipeline "$OPERATION" --source "$BUILD_SOURCE"
