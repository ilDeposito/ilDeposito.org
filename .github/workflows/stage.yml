name: Stage

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operazione da eseguire su stage
        required: true
        default: deploy
        type: choice
        options: [deploy, content, full, pdf]
      source:
        description: Origine del trigger
        required: false
        default: GitHub
        type: string

concurrency:
  group: stage-operations
  cancel-in-progress: false

jobs:
  stage:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /home/ubuntu/sergej/websites/ildeposito/stage
    steps:
      - name: Run stage operation
        env:
          OPERATION: ${{ inputs.operation }}
          DEPLOY_REF: ${{ github.sha }}
          BUILD_SOURCE: ${{ inputs.source }}
        run: ./ildeposito.sh pipeline "$OPERATION" --ref "$DEPLOY_REF" --source "$BUILD_SOURCE"
