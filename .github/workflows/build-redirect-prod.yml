name: Build Redirect (Prod)

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Origine del trigger (impostata automaticamente da Drupal quando parte dal pulsante "Pubblica")'
        required: false
        default: 'GitHub'

# Stesso gruppo di tutte le operazioni prod: oltre ad astro-builder, deploy e
# build condividono working copy, volumi e container dell'ambiente.
concurrency:
  group: prod-operations
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /home/ubuntu/sergej/websites/ildeposito/prod

    steps:
      - name: Build redirect
        run: ./ildeposito.sh build-redirect --source "${{ inputs.source }}"
