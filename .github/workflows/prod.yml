name: Production

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      operation:
        description: Operazione da eseguire in produzione
        required: true
        default: deploy
        type: choice
        options: [deploy, content, full, pdf, redirect]
      release_tag:
        description: Tag da distribuire (obbligatorio solo per deploy manuale)
        required: false
        type: string
      source:
        description: Origine del trigger
        required: false
        default: GitHub
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: prod-operations
  cancel-in-progress: false

jobs:
  production:
    runs-on: self-hosted
    env:
      OPERATION: ${{ github.event_name == 'push' && 'deploy' || inputs.operation }}
      DEPLOY_REF: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      BUILD_SOURCE: ${{ inputs.source || 'GitHub' }}
    defaults:
      run:
        working-directory: /home/ubuntu/sergej/websites/ildeposito/prod
    steps:
      - name: Verifica deploy stage
        if: env.OPERATION == 'deploy'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          stage_status="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/ilDeposito/ilDeposito.org/actions/workflows/stage.yml/runs?event=workflow_dispatch&per_page=100' \
            | python3 -c 'import json, os, sys; runs = json.load(sys.stdin)["workflow_runs"]; run = next((item for item in runs if item["head_sha"] == os.environ["DEPLOY_SHA"]), None); print("{}\t{}".format(run["status"], run["conclusion"] or "") if run else "")')"
          [[ "$stage_status" == $'completed\tsuccess' ]] || {
            echo 'L’ultima run stage di questo commit non è riuscita.' >&2
            exit 1
          }
      - name: Prepara deploy e dipendenze
        if: env.OPERATION == 'deploy'
        run: |
          git fetch origin main --tags --quiet
          git show "refs/tags/${DEPLOY_REF}:ildeposito.sh" > .ildeposito-deploy.sh
          trap 'rm -f .ildeposito-deploy.sh' EXIT
          bash ./.ildeposito-deploy.sh pipeline deploy-prepare --ref "$DEPLOY_REF"
      - name: Aggiorna Drupal e indice di ricerca
        if: env.OPERATION == 'deploy'
        run: ./ildeposito.sh pipeline deploy-update
      - name: Genera sito, PDF e redirect
        if: env.OPERATION == 'deploy'
        run: ./ildeposito.sh pipeline deploy-build --source "$BUILD_SOURCE"
      - name: Esegue operazione di pubblicazione
        if: env.OPERATION != 'deploy'
        run: ./ildeposito.sh pipeline "$OPERATION" --source "$BUILD_SOURCE"
