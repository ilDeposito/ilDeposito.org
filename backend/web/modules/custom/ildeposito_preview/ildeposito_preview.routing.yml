ildeposito_preview.redirect:
  path: '/node/{node}/anteprima-frontend'
  defaults:
    _controller: '\Drupal\ildeposito_preview\Controller\PreviewRedirectController::previewRedirect'
  requirements:
    _permission: 'preview drupal content'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node
