services:
  Drupal\ildeposito_utils\Hook\IldepositoUtilsHooks:
    autowire: true

  Drupal\ildeposito_utils\EventSubscriber\JsonApiWriteFirewall:
    tags:
      - { name: event_subscriber }

  Drupal\ildeposito_utils\Routing\ReportsAccessRouteSubscriber:
    tags:
      - { name: event_subscriber }

  ildeposito_utils.facebook_page_client:
    class: Drupal\ildeposito_utils\Service\FacebookPageClient
    arguments: ['@http_client']

  Drupal\ildeposito_utils\Service\FacebookPageClient:
    alias: ildeposito_utils.facebook_page_client

  Drupal\ildeposito_utils\Service\FacebookTelegramPublisher:
    autowire: true

  Drupal\ildeposito_utils\Controller\FacebookWebhookController:
    autowire: true

  Drupal\ildeposito_utils\EventSubscriber\FacebookTelegramQueueTerminateSubscriber:
    arguments:
      - '@queue'
      - '@plugin.manager.queue_worker'
      - '@logger.channel.ildeposito_utils'
    tags:
      - { name: event_subscriber }

  logger.channel.ildeposito_utils:
    parent: logger.channel_base
    arguments: ['ildeposito_utils']
